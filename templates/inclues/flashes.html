<style>
  .flash-overlay {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 1080;
    width: min(420px, calc(100vw - 2rem));
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    pointer-events: none;
  }

  .flash-overlay .alert {
    pointer-events: auto;
    margin-bottom: 0;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  }
</style>

<div class="flash-overlay">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        {% if category == "error" %}
          {% set category = "danger" %}
        {% endif %}

        <div
          class="alert alert-{{ category }} alert-dismissible fade show"
          role="alert"
        >
          {{ message }}
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"
          ></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>

<script>
  window.addEventListener("load", function () {
    document.querySelectorAll(".flash-overlay .alert").forEach(function (alertEl) {
      setTimeout(function () {
        if (typeof bootstrap !== "undefined") {
          bootstrap.Alert.getOrCreateInstance(alertEl).close();
        } else {
          alertEl.remove();
        }
      }, 3000);
    });
  });
</script>
