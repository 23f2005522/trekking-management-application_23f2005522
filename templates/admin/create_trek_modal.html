<div class="modal fade" id="createTrekModal" tabindex="-1" aria-labelledby="createTrekModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="createTrekModalLabel">
                    Add New Trek
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="/admin/manage_treks/create" method="POST">
                <div class="modal-body">
                    <p class="text-muted">
                        Create a new trekking event and assign an approved staff member.
                    </p>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Trek Name</label>
                            <input type="text" class="form-control" name="name" placeholder="Enter trek name"
                                required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" name="location" placeholder="Enter trek location"
                                required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Difficulty</label>
                            <select class="form-select" name="difficulty" required>
                                <option value="">-- Select Difficulty --</option>
                                <option value="easy">Easy</option>
                                <option value="moderate">Moderate</option>
                                <option value="difficult">Difficult</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Duration (Days)</label>
                            <input type="number" class="form-control" name="duration" min="1"
                                placeholder="Must match start and end dates" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Total Slots</label>
                            <input type="number" class="form-control" name="total_slots" min="1" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" class="form-control" name="price" step="0.01" min="0" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="datetime-local" class="form-control" name="starting_at" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Date</label>
                            <input type="datetime-local" class="form-control" name="ending_at" required />
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Assign Staff (Staff ID)</label>
                            <select class="form-select" name="assigned_staff_id" required>
                                <option value="">-- Select Staff --</option>
                                {% for staff in staffs %}
                                <option value="{{ staff.staff_profile.id }}">
                                    {{ staff.username }} — Staff ID: {{ staff.staff_profile.id }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status" required>
                                <option value="">-- Select Status --</option>
                                <option value="pending">Pending</option>
                                <option value="approved">Approved</option>

                            </select>
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-control" name="image_url"
                                placeholder="https://example.com/trek-image.jpg" />
                        </div>

                        <div class="col-12 mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="3" name="description"
                                placeholder="Describe the trek..."></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-success px-4">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>
